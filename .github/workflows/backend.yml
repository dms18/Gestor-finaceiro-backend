name: Backend - build e deploy

on:
  push:
    branches: [main]
    paths:
      - 'gerenciador-api/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'gerenciador-api/**'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: gestor-api

jobs:
  test:
    name: Testes e build do jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gerenciador-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: gerenciador-api/pom.xml

      # As chaves JWT vêm de volume em produção; o Dockerfile também as remove do jar.
      - name: Maven verify
        run: mvn -B verify

  publish:
    name: Imagem arm64 no GHCR
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (minúsculas)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O estágio Maven roda na arquitetura do runner; só a imagem final é arm64.
      - uses: docker/build-push-action@v6
        with:
          context: gerenciador-api
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  deploy:
    name: Deploy no servidor
    needs: publish
    runs-on: [self-hosted, gestor]
    environment: production
    concurrency: deploy-gestor
    env:
      APP_DIR: /opt/gestor
      IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Baixar imagem e apontar a tag local
        run: |
          docker pull "$IMAGE:${{ github.sha }}"
          # O docker-compose.yml do servidor usa gestor-api:latest.
          docker tag "$IMAGE:${{ github.sha }}" gestor-api:latest

      - name: Conferir variáveis de e-mail (recuperação de senha)
        run: |
          for v in SMTP_HOST SMTP_USER SMTP_PASSWORD SMTP_FROM; do
            grep -q "^${v}=." "$APP_DIR/.env" || echo "::warning::$v não definido em $APP_DIR/.env - o envio do código de redefinição de senha vai falhar"
          done

      - name: Subir a API
        working-directory: ${{ env.APP_DIR }}
        run: docker compose up -d api

      # A API leva ~70 s para iniciar; enquanto isso o nginx responde 502.
      - name: Aguardar a API responder
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost/api/auth/login || true)
            if [ "$code" != "502" ] && [ "$code" != "503" ] && [ "$code" != "000" ]; then
              echo "API respondeu HTTP $code"
              exit 0
            fi
            sleep 5
          done
          echo "::error::A API não respondeu em 200 s"
          docker compose -f "$APP_DIR/docker-compose.yml" logs --tail 80 api
          exit 1

      - name: Limpar imagens antigas
        if: always()
        run: docker image prune -f
