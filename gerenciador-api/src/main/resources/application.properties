# Datasource Configuration
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/gestor_mei?createDatabaseIfNotExist=true
quarkus.datasource.db-version=5.5.5

# Hibernate Configuration
quarkus.hibernate-orm.database.version-check.enabled=false
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation.create-schemas=true

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-max-age=24H

## JWT Configuration
mp.jwt.verify.issuer=gestor-mei
mp.jwt.verify.audiences=gestor-mei-app
smallrye.jwt.sign.key.location=/privateKey.pem
mp.jwt.verify.publickey.location=/publicKey.pem

# OpenAPI / Swagger — exposto apenas em dev; em produção o Swagger UI fica desabilitado
%dev.quarkus.swagger-ui.always-include=true

# Criptografia em repouso de dados sensíveis (CPF/CNPJ) — AES-256-GCM.
# DEFINA app.crypto.secret via variável de ambiente forte e única em produção
# (APP_CRYPTO_SECRET). O default abaixo é apenas para desenvolvimento local.
# ATENÇÃO: trocar o segredo torna ilegíveis os dados já cifrados com o segredo antigo.
app.crypto.secret=${APP_CRYPTO_SECRET:dev-secret-troque-em-producao}

# Logging
quarkus.log.level=INFO

# OpenTelemetry — exporta traces e logs via OTLP para o OpenTelemetry Collector,
# que por sua vez encaminha ao Azure Application Insights (exporter azuremonitor).
# A aplicação fala apenas OTLP puro; a integração com o Azure fica isolada no Collector.
quarkus.application.name=gerenciador-api
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.enabled=true
quarkus.otel.logs.enabled=true
# spans de queries no banco (instrumentação JDBC)
quarkus.datasource.jdbc.telemetry=true
